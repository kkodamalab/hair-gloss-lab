name: Hair Gloss Lab checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check analysis.js && node --check analysis-modes.js && node --check app.js
      - run: node tests/analysis-modes.test.cjs && node tests/common-psd-band.test.cjs
